name: Build debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Locate project
        id: loc
        shell: bash
        run: |
          set -e
          if ls ./*.zip >/dev/null 2>&1; then
            ZIP=$(ls ./*.zip | head -n1)
            mkdir -p _unzipped
            unzip -q -o "$ZIP" -d _unzipped
            DIR=$(dirname "$(find _unzipped -name settings.gradle.kts | head -n1)")
          else
            DIR=.
          fi
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          files: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
